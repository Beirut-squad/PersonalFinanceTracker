name: Finance Tracker Validation

on:
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Run Finance Tracker Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run validations
        id: run-validations
        run: |
          # ... (same Kotlin test runner code as before)

      - name: Create check run
        uses: actions/github-script@v6
        if: always()
        env:
          RESULTS: "${{ steps.run-validations.outputs.results }}"
          SUCCESS: "${{ steps.run-validations.outputs.success }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "Finance Tracker Validation",
                head_sha: context.sha,
                status: "completed",
                conclusion: process.env.SUCCESS === 'true' ? 'success' : 'failure',
                output: {
                  title: process.env.SUCCESS === 'true' ? 'All validations passed' : 'Some validations failed',
                  summary: process.env.RESULTS
                }
              });
            } catch (error) {
              console.error('Error creating check run:', error);
              // Fallback to regular status output
              core.summary
                .addHeading('Validation Results')
                .addRaw(process.env.RESULTS)
                .write();
            }