name: Finance Tracker Validation

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Run Finance Tracker Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Kotlin Compiler
        run: |
          curl -s https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin

      - name: Check Kotlin Version
        run: kotlinc -version

      - name: Run validations
        id: run-validations
        run: |
          # Find all Kotlin source files
          KOTLIN_SOURCES=$(find src -name "*.kt" | tr '\n' ' ')

          # Create test runner file without package declaration
          cat << 'EOF' > RunValidations.kt
          @file:JvmName("ValidationRunner")

          import core.FinanceTrackerManager
          import core.FinanceTrackerManagerImpl
          import datasource.FinanceTrackerDataSource
          import datasource.InMemoryDataSource
          import core.FinanceTrackerValidator
          import core.FinanceTrackerValidatorImp
          import test.AddTransactionChecker
          import test.DeleteTransactionChecker
          import test.EditTransactionChecker
          import test.BalanceReportChecker
          import test.GetMonthlySummeryChecker
          import test.Checker
          import models.*

          import java.io.File

          fun main() {
              val dataSource: FinanceTrackerDataSource = InMemoryDataSource()
              val validator: FinanceTrackerValidator = FinanceTrackerValidatorImp()
              val financeTrackerManager: FinanceTrackerManager = FinanceTrackerManagerImpl(dataSource, validator)
              val checker = Checker()

              val results = listOf<Pair<String, () -> Unit>>(
                  "Add Transaction" to {
                      AddTransactionChecker(financeTrackerManager, checker).runAddChecks()
                  },
                  "Delete Transaction" to {
                      DeleteTransactionChecker(
                          FinanceTrackerManagerImpl(dataSource, validator),
                          checker
                      ).runDeleteChecks()
                  },
                  "Edit Transaction" to {
                      EditTransactionChecker(
                          FinanceTrackerManagerImpl(dataSource, validator),
                          checker
                      ).runEditTransactionChecks()
                  },
                  "Balance Report" to {
                      BalanceReportChecker(financeTrackerManager, checker).runBalanceReportChecks()
                  },
                  "Monthly Summary" to {
                      GetMonthlySummeryChecker(financeTrackerManager, checker).runMonthlySummaryChecks()
                  }
              )

              val output = mutableListOf<String>()
              var allSuccess = true

              results.forEach { (name, test) ->
                  try {
                      println("::group::$name Checks")
                      dataSource.clear()
                      test()
                      output.add("✓ $name - All tests passed")
                      println("*************** End Test ***************")
                      println("::endgroup::")
                  } catch (e: Exception) {
                      allSuccess = false
                      output.add("✗ $name - ${e.message ?: "Test failed"}")
                      println("*************** End Test ***************")
                      println("::endgroup::")
                      println("::error::${e.message}")
                  }
              }

              val githubOutput = System.getenv("GITHUB_OUTPUT")
              File(githubOutput).appendText("results=${output.joinToString("%0A")}\n")
              File(githubOutput).appendText("success=$allSuccess\n")

              if (!allSuccess) {
                  throw Exception("Some validations failed")
              }
          }
          EOF

          # Compile all sources together
          echo "Compiling Kotlin files..."
          kotlinc $KOTLIN_SOURCES RunValidations.kt -include-runtime -d RunValidations.jar

          # Run the compiled test runner
          echo "Running validations..."
          java -jar RunValidations.jar

      - name: Create check run
        if: always()
        uses: actions/github-script@v6
        env:
          RESULTS: "${{ steps.run-validations.outputs.results }}"
          SUCCESS: "${{ steps.run-validations.outputs.success }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "Finance Tracker Checks",
                head_sha: context.sha,
                status: "completed",
                conclusion: process.env.SUCCESS === 'true' ? 'success' : 'failure',
                output: {
                  title: process.env.SUCCESS === 'true'
                    ? 'All checks passed'
                    : 'Some checks failed',
                  summary: process.env.RESULTS.replace(/%0A/g, '\n'),
                  text: 'See workflow run for details'
                }
              })
            } catch (error) {
              core.error('Failed to create check run: ' + error.message)
              await core.summary
                .addHeading('Validation Results')
                .addRaw(process.env.RESULTS.replace(/%0A/g, '\n'))
                .write()
            }
