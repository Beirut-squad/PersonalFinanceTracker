name: Finance Tracker Validation

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Run Finance Tracker Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Kotlin Compiler
        run: |
          curl -s https://get.sdkman.io | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install kotlin

      - name: Check Kotlin Version
        run: kotlinc -version

      - name: Run validations
        id: run-validations
        run: |
          # Find all Kotlin source files
          KOTLIN_SOURCES=$(find src -name "*.kt" | tr '\n' ' ')

          # Create test runner file without package declaration
          cat << 'EOF' > RunValidations.kt
          @file:JvmName("ValidationRunner")

          import core.FinanceTrackerManager
          import core.FinanceTrackerManagerImpl
          import datasource.FinanceTrackerDataSource
          import datasource.InMemoryDataSource
          import core.FinanceTrackerValidator
          import core.FinanceTrackerValidatorImp
          import test.AddTransactionChecker
          import test.DeleteTransactionChecker
          import test.EditTransactionChecker
          import test.BalanceReportChecker
          import test.GetMonthlySummeryChecker
          import test.Checker
          import models.*

          import java.io.File

          fun main() {
              val dataSource: FinanceTrackerDataSource = InMemoryDataSource()
              val validator: FinanceTrackerValidator = FinanceTrackerValidatorImp()
              val financeTrackerManager: FinanceTrackerManager = FinanceTrackerManagerImpl(dataSource, validator)
              val checker = Checker()

              val results = listOf(
                  "Add Transaction" to { AddTransactionChecker(financeTrackerManager, checker).runAddChecks() },
                  "Delete Transaction" to { DeleteTransactionChecker(financeTrackerManager, checker).runDeleteChecks() },
                  "Edit Transaction" to { EditTransactionChecker(financeTrackerManager, checker).runEditTransactionChecks() },
                  "Balance Report" to { BalanceReportChecker(financeTrackerManager, checker).runBalanceReportChecks() },
                  "Monthly Summary" to { GetMonthlySummeryChecker(financeTrackerManager, checker).runMonthlySummaryChecks() }
              )

              val output = mutableListOf<String>()
              var allSuccess = true

              results.forEach { (name, test) ->
                  try {
                      dataSource.clear()
                      test()
                      println("::notice::✓ $name")
                      output.add("✓ $name")
                  } catch (e: Exception) {
                      allSuccess = false
                      println("::error::✗ $name - ${e.message ?: "Test failed"}")
                      output.add("✗ $name - ${e.message ?: "Test failed"}")
                  }
              }

              // Set outputs
              println("::set-output name=results::${output.joinToString("%0A")}")
              println("::set-output name=success::$allSuccess")

              if (!allSuccess) {
                  throw Exception("Some validations failed")
              }
          }
          EOF

          # Compile and run tests
          kotlinc RunValidations.kt -include-runtime -d RunValidations.jar
          TEST_OUTPUT=$(kotlin -classpath RunValidations.jar ValidationRunnerKt 2>&1 || true)
          
          # Parse and format output
          echo "TEST_RESULTS<<EOF" >> $GITHUB_OUTPUT
          echo "$TEST_OUTPUT" | grep -E '::(notice|error)::' | sed 's/::.*:://' >> $GITHUB_OUTPUT
          echo "EOF"
          
          # Set success status
          if echo "$TEST_OUTPUT" | grep -q "::error::"; then
            echo "HAS_FAILURES=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_FAILURES=false" >> $GITHUB_OUTPUT
          fi

      - name: Create visible summary
        if: always()
        run: |
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.run-tests.outputs.TEST_RESULTS }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if ${{ steps.run-tests.outputs.HAS_FAILURES == 'true' }}; then
            echo "❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          fi