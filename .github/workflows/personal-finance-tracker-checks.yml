name: Finance Tracker Validation

on:
  pull_request:
    branches: [ develop ]  # Changed from main to develop
  push:
    branches: [ develop ]  # Optional: also run on direct pushes to develop

# Required permissions to create check runs
permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  validation:
    name: Run Finance Tracker Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run validations
        id: run-validations
        run: |
          
          # Find all Kotlin source files from all relevant source directories
          KOTLIN_SOURCES=$(find src/core src/datasource src/test src/models src/manager -name "*.kt" | tr '\n' ' ')
          
          import core.*
          import datasource.*
          import test.*
          import models.*
          
          fun main() {
              val dataSource: FinanceTrackerDataSource = InMemoryDataSource()
              val validator: FinanceTrackerValidator = FinanceTrackerValidatorImp()
              val financeTrackerManager: FinanceTrackerManager = FinanceTrackerManagerImpl(dataSource, validator)

              val results = listOf(
                  Pair("Add Transaction") { 
                      AddTransactionChecker(financeTrackerManager).runAddTests() 
                  },
                  Pair("Delete Transaction") { 
                      DeleteTransactionChecker(financeTrackerManager).runAllDeleteChecker() 
                  },
                  Pair("Edit Transaction") { 
                      EditTransactionChecker(financeTrackerManager).editTransactionCheck() 
                  },
                  Pair("Balance Report") { 
                      BalanceReportChecker(financeTrackerManager).checkBalanceReport() 
                  },
                  Pair("Monthly Summary") { 
                      GetMonthlySummeryChecker(financeTrackerManager).runAllMonthlySummaryChecks() 
                  }
              )

              val output = mutableListOf<String>()
              var allSuccess = true

              results.forEach { (name, test) ->
                  try {
                      println("::group::$name Checks")
                      dataSource.clear()
                      test()
                      output.add("✓ $name - All tests passed")
                      println("::endgroup::")
                  } catch (e: Exception) {
                      allSuccess = false
                      output.add("✗ $name - ${e.message ?: "Test failed"}")
                      println("::endgroup::")
                      println("::error::${e.message}")
                  }
              }

              println("::set-output name=results::${output.joinToString("%0A")}")
              println("::set-output name=success::$allSuccess")
          
              if (!allSuccess) {
                  throw Exception("Some validations failed")
              }
          }
          EOF
          
          # Compile and run
          kotlinc RunValidations.kt -include-runtime -d RunValidations.jar
          java -jar RunValidations.jar

      - name: Create check run
        if: always()
        uses: actions/github-script@v6
        env:
          RESULTS: "${{ steps.run-validations.outputs.results }}"
          SUCCESS: "${{ steps.run-validations.outputs.success }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "Finance Tracker Checks",
                head_sha: context.sha,
                status: "completed",
                conclusion: process.env.SUCCESS === 'true' ? 'success' : 'failure',
                output: {
                  title: process.env.SUCCESS === 'true' ? 
                    'All checks passed' : 'Some checks failed',
                  summary: process.env.RESULTS.replace(/%0A/g, '\n'),
                  text: 'See workflow run for details'
                }
              })
            } catch (error) {
              core.error('Failed to create check run: ' + error.message)
              // Fallback to job summary
              await core.summary
                .addHeading('Validation Results')
                .addRaw(process.env.RESULTS.replace(/%0A/g, '\n'))
                .write()
            }